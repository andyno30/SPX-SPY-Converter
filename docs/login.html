<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spyconverter Pro Login</title>
    <link rel="icon" type="image/x-icon" href="/Images/favicon.ico" />
    <link href="styles.css" rel="stylesheet" />
</head>
<body>
    <nav>
        <a class="logo" href="https://spyconverter.com/index.html"><h4>spyconverter.com</h4></a>
        <ul class="nav-links">
            <li><a href="https://spyconverter.com/index.html">Home</a></li>
            <li><a href="https://news.spyconverter.com/news">News</a></li>
            <li><a href="https://spyconverter.com/options/">Options</a></li>
            <li><a href="https://spyconverter.com/blog.html">Blog</a></li>
            <li class="dropdown">
                <a href="https://spyconverter.com/aboutus.html">About Us</a>
                <div class="dropdown-content">
                    <a href="https://spyconverter.com/aboutus.html#about-us">About Us</a>
                    <a href="https://spyconverter.com/aboutus.html#privacy-policy">Privacy Policy</a>
                    <a href="https://spyconverter.com/aboutus.html#contact-us">Contact Us</a>
                    <a href="https://spyconverter.com/aboutus.html#disclaimer">Disclaimer</a>
                    <a href="https://spyconverter.com/aboutus.html#terms-and-conditions">Terms and Conditions</a>
                    <a href="https://spyconverter.com/relationship.html">Relationship</a>
                </div>
            </li>
            <li><a href="#auth-section">Login</a></li>
        </ul>
    </nav>

    <div class="main-container">
        <div class="auth-section" id="auth-section">
            <h2>User Authentication</h2>

            <label for="email-input">Email:</label>
            <input type="email" id="email-input" placeholder="Enter your email" required />

            <label for="password-input">Password:</label>
            <input type="password" id="password-input" placeholder="Enter your password" required />

            <div style="margin: 6px 0;">
              <a href="forgot-password.html" style="font-size: 0.9rem;">Forgot password?</a>
            </div>

            <button onclick="goToSignup()">Sign Up</button>
            <button onclick="emailLogin()">Log In</button>
            <button onclick="googleLoginSignup()">Login/Signup with Google</button>

            <div id="feedback"></div>
            <p id="login-status" style="display: none; color: #666;"></p>
        </div>

        <h1>SPX-SPY Converter</h1>
    </div>

    <footer>
        <p>© 2025 spyconverter.com. All rights reserved.</p>
    </footer>

    <!-- Load shared functions as a module -->
    <script type="module" src="script.js"></script>

    <!-- Page-specific Supabase login logic -->
    <script type="module">
      import { signIn, signInWithGoogle, supabase } from './auth.js';

      const requestedReturnTo = new URLSearchParams(window.location.search).get('return_to');
      const safeReturnTo = (() => {
        if (!requestedReturnTo) return null;
        try {
          const target = new URL(requestedReturnTo);
          return target.origin === 'https://news.spyconverter.com' && target.pathname === '/news'
            ? target.toString()
            : null;
        } catch {
          return null;
        }
      })();

      window.goToSignup = function goToSignup() {
        const suffix = safeReturnTo ? `?return_to=${encodeURIComponent(safeReturnTo)}` : '';
        window.location.href = `register.html${suffix}`;
      };

      async function returnWithSession() {
        if (!safeReturnTo) {
          window.location.href = 'dashboard.html';
          return;
        }

        const { data: { session } } = await supabase.auth.getSession();
        if (!session) throw new Error('The login session could not be created.');

        const target = new URL(safeReturnTo);
        target.hash = new URLSearchParams({
          access_token: session.access_token,
          refresh_token: session.refresh_token,
          expires_in: String(session.expires_in || 3600),
          token_type: session.token_type || 'bearer',
        }).toString();
        window.location.href = target.toString();
      }

      // Email/password login (keeps your function name)
      window.emailLogin = async function emailLogin() {
        const email = document.getElementById('email-input').value;
        const password = document.getElementById('password-input').value;
        const feedback = document.getElementById('feedback');
        const loginStatus = document.getElementById('login-status');

        if (!email || !password) {
          feedback.textContent = 'Please enter both email and password.';
          return;
        }

        loginStatus.style.display = 'block';
        loginStatus.textContent = 'Connecting, please wait...';
        feedback.textContent = '';

        try {
          await signIn(email, password);
          loginStatus.style.display = 'none';
          alert('Login successful! Redirecting...');
          setTimeout(() => void returnWithSession(), 500);
        } catch (err) {
          loginStatus.style.display = 'none';
          feedback.textContent = err.message || 'Login failed';
        }
      };

      // Google OAuth login/signup (keeps your function name)
      window.googleLoginSignup = async function googleLoginSignup() {
        const feedback = document.getElementById('feedback');
        try {
          await signInWithGoogle(safeReturnTo || `${window.location.origin}/docs/dashboard.html`);
          // Supabase handles the redirect automatically
        } catch (err) {
          feedback.textContent = err.message || 'Google login failed';
        }
      };
    </script>
</body>
</html>
