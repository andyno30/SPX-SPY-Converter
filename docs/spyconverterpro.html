<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Spyconverter Pro</title>
    <link rel="icon" type="image/x-icon" href="/Images/favicon.ico">
    <link href="styles.css?v=20260902-pro-layout" rel="stylesheet" />
    <link href="account-nav.css?v=20260830" rel="stylesheet" />
</head>
<body>
    <div class="main-container">
        <h1>Spyconverter Pro</h1>
        <p>Welcome to the premium Spyconverter Pro experience!</p>
        <p>This is your exclusive access page for subscribed users.</p>
        <div class="pro-action-group">
            <div class="pro-feature-buttons">
                <button id="premium-feature-btn" style="display: none;">Access Premium Feature</button>
                <button id="dow-russell-feature-btn" style="display: none;">Dow Jones and Russell 2000 Converter</button>
            </div>
            <div class="pro-account-actions">
                <a href="settings.html" class="settings-square-link" aria-label="Account settings" title="Account settings">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.14 12.94c.04-.31.06-.63.06-.94s-.02-.63-.07-.94l2.03-1.58-1.92-3.32-2.39.96a7.3 7.3 0 0 0-1.62-.94L14.87 3h-3.84l-.38 2.18c-.58.24-1.12.56-1.62.94l-2.39-.96-1.92 3.32 2.03 1.58c-.04.31-.07.65-.07.96s.02.62.07.92l-2.03 1.58 1.92 3.32 2.39-.96c.5.39 1.04.71 1.62.95l.38 2.17h3.84l.37-2.17c.58-.24 1.13-.56 1.63-.95l2.39.96 1.92-3.32-2.04-1.58ZM12.95 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7Z"/></svg>
                    <span>Settings</span>
                </a>
                <button id="logout-btn">Log out</button>
            </div>
        </div>
        <p id="feature-feedback"></p>
    </div>

    <!-- Use Supabase (no layout/style changes) -->
    <script type="module">
        import { supabase, signOut } from './auth.js';

        async function checkAccess() {
            // Require logged-in user
            const { data: { user }, error } = await supabase.auth.getUser();
            if (error || !user) {
                window.location.href = 'login.html';
                return;
            }

            // Check subscription flag in profiles
            const { data: profile, error: profileError } = await supabase
                .from('profiles')
                .select('is_subscribed')
                .eq('id', user.id)
                .single();

            // Not subscribed → send back to dashboard
            if (profileError || !profile?.is_subscribed) {
                window.location.href = 'dashboard.html';
                return;
            }

            // Subscribed → reveal feature buttons
            const premiumBtn = document.getElementById('premium-feature-btn');
            const dowRussellBtn = document.getElementById('dow-russell-feature-btn');
            if (premiumBtn) premiumBtn.style.display = 'block';
            if (dowRussellBtn) dowRussellBtn.style.display = 'block';
        }

        // Premium feature navigation (unchanged)
        document.getElementById('premium-feature-btn').addEventListener('click', () => {
            window.location.href = 'premium-feature.html';
        });

        document.getElementById('dow-russell-feature-btn').addEventListener('click', () => {
            window.location.href = 'dow-russell-feature.html';
        });

        // Logout (uses Supabase signOut)
        document.getElementById('logout-btn').addEventListener('click', async () => {
            await signOut();
            window.location.href = 'login.html';
        });

        // Run on load
        checkAccess();
    </script>
</body>
</html>
